# 2026-10-28：opencode.ai 直连反代（非 muse 模型上行）
#
# 背景：muse-spark 系列受地区限制（直连返回 403 RegionError: not available in your country），
# 必须走日本出口（sing-box muse-egress）；deepseek/mimo/claude 直连可用。
# 为避免「日本出口节点故障 → 所有模型全挂」，LiteLLM 里非 muse deployment 的 api_base
# 指向本反代，由 nginx 直连 opencode.ai（不经 sing-box / 不读 HTTPS_PROXY）。
#
# 回滚：删除本文件 → nginx -t && nginx -s reload；并把 LiteLLM deployment api_base 改回
#       https://opencode.ai/inference/go/openai/v1（脚本见 pool/tools/switch_upstream_api_base.py）。
server {
    # 本机反代监听。容器内（LiteLLM）访问时还需放开下一行，并把它替换成
    # 宿主机 Docker 网桥网关地址（占位 <docker-bridge-gateway>，不同宿主地址不同，
    # 由部署方填写；不要直接监听 0.0.0.0 暴露到公网）。
    listen 127.0.0.1:4002;
    # listen <docker-bridge-gateway>:4002;
    server_name _;

    client_max_body_size 200m;
    resolver 183.60.83.19 183.60.82.98 valid=60s ipv6=off;
    set $oc_upstream https://opencode.ai;

    location / {
        proxy_pass $oc_upstream$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name opencode.ai;
        proxy_http_version 1.1;
        proxy_set_header Host opencode.ai;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}
