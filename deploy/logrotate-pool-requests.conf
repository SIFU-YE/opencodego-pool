# OpencodeLitellmPool · 逐请求日志轮转示例（logrotate）
#
# 安装：
#   install -m 644 deploy/logrotate-pool-requests.conf /etc/logrotate.d/opencodego-pool-requests
#
# 为什么必须轮转：
#   · pool-requests.jsonl 由 LiteLLM 回调 pool_logger.py 逐请求追加，无自带上限；
#   · 空跑一天就是 10~20 MB，长期不轮转会占满磁盘；
#   · 轮转后必须保持 0600（日志含会话 id / 用量 / 账号尾号等运营数据）。
#
# 为什么 copytruncate 安全：
#   pool_logger.py 每次回调都以 O_APPEND 打开-写入-关闭（无常驻 fd），
#   截断后下一次写入自动回到文件末尾，不需要重启 litellm 容器。
#
# 路径按 ${POOL_HOME}/pool-requests.jsonl 调整（默认 /opt/litellm）。

/opt/litellm/pool-requests.jsonl {
    daily
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su root root
    create 0600 root root
    postrotate
        chmod 600 /opt/litellm/pool-requests.jsonl 2>/dev/null || true
    endscript
}
