# OpencodeLitellmPool · 可选反向代理示例（nginx）
#
# 把本文件 include 进你自己的 server { } 块，例如：
#   include /opt/litellm/deploy/nginx-pool-location.conf;
#
# 安全边界（必读）：
#   · 本项目 **不内置账号体系**，也无 Halo / auth_request 依赖；
#   · 所有服务默认只监听 127.0.0.1；若要通过 nginx 暴露到内网/公网，
#     **请自行在外层加 VPN 或反向代理鉴权（basic_auth / oauth2-proxy / mTLS 均可）**；
#   · 看板内「管理控制台」页签能改上游账号密钥与模型 allowlist，等于号池的根权限，
#     没有鉴权时**不要**直接暴露到公网。
#   · 占位符：<pool-host> 换成你自己的域名；不要提交真实域名/IP。
#
# 典型用法：server { listen 127.0.0.1:8443 ssl; server_name <pool-host>; ... }
# 或由外层已有网关再转发到 127.0.0.1:4001 / 127.0.0.1:4010。

# ---------------------------------------------------------------------------
# 1) OpenAI 兼容 API：/pool/v1/ → session-sidecar（127.0.0.1:4001）
# ---------------------------------------------------------------------------
location ^~ /pool/v1/ {
    proxy_pass http://127.0.0.1:4001/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # 流式（SSE）长请求：关闭缓冲，读超时与 LiteLLM request_timeout(3600s) 对齐
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 64m;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ---------------------------------------------------------------------------
# 2) 看板（含管理控制台页签）：/pool/ → dashboard（127.0.0.1:4010）
# ---------------------------------------------------------------------------
location = /pool {
    return 301 /pool/;
}

location ^~ /pool/ {
    # ── 安全默认（2026-10-20 加固）─────────────────────────────────────────────
    # 看板含「管理控制台」页签（能改上游账号密钥与模型 allowlist = 号池根权限）、
    # 账号邮箱与逐请求会话数据。所以**默认只允许本机访问**，不会因为照抄本示例而裸奔。
    # 要远程访问，必须二选一（不要两者都不做）：
    #   ① 保留这两行 + 在外层网关做鉴权（VPN / oauth2-proxy / mTLS）；
    #   ② 注释掉这两行，改用下面的 basic_auth 模板（至少一道认证）。
    allow 127.0.0.1;
    deny all;

    proxy_pass http://127.0.0.1:4010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # 看板含密钥指纹/管理操作，禁止任何缓存与嵌入
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}

# 说明：
#   · 反代是可选的：同机/内网客户端可直连 http://127.0.0.1:4001/v1；
#   · 远程访问建议只暴露 /pool/v1/（客户端 API），看板/管理页留在 VPN 内；
#   · /pool/ 已默认 allow 127.0.0.1 + deny all；若要远程访问，启用下面模板之一。

# ── 可选：给 /pool/ 加内联 basic_auth（替代 allow/deny）─────────────────────
# 1) 生成口令文件：htpasswd -c /etc/nginx/pool-dash.htpasswd <user>
# 2) 把下面两行放进 location ^~ /pool/ { } 内，并注释掉里面的 allow/deny：
#        auth_basic           "OpencodeLitellmPool";
#        auth_basic_user_file /etc/nginx/pool-dash.htpasswd;
# 3) nginx -t && nginx -s reload
