# [可选] 号池看板反向代理示例（nginx）—— 无 Halo / 无 auth_request 依赖
#
# 历史部署曾用 Halo 的 auth_request 给看板加登录门禁；独立部署套件不再依赖 Halo，
# 本文件只保留纯 proxy_pass。默认建议只监听 127.0.0.1：
#   · 本项目不内置账号体系，看板内「管理控制台」页签等于号池根权限；
#   · 远程访问请自行加 VPN / 反向代理鉴权（basic_auth / oauth2-proxy / mTLS 均可）；
#   · 不要在没有鉴权的情况下把 4010 暴露到公网。
#
# 把下面内容 include 进你的 server { } 块。占位符：<pool-host>。

location = /works/pool {
    return 301 /works/pool/;
}

location ^~ /works/pool/ {
    # ── 安全默认（2026-10-20 加固）─────────────────────────────────────────────
    # 看板含管理控制台（号池根权限）、账号邮箱与逐请求会话数据 → **默认只允许本机**。
    # 远程访问二选一：① 保留 allow/deny + 外层网关鉴权；② 改内联 basic_auth（见文末模板）。
    allow 127.0.0.1;
    deny all;

    # 独立部署默认看板端口 4010（可用 deploy/.env 的 DASHBOARD_PORT 调整）
    proxy_pass http://127.0.0.1:4010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # 看板含账号指纹/管理操作：禁止缓存，禁止被 iframe 嵌入
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}

# 客户端 API 走 sidecar 4001，完整示例见 deploy/nginx-pool-location.conf
# （/pool/v1/ → 127.0.0.1:4001/v1/，SSE 需 proxy_buffering off）。

# ── 可选：内联 basic_auth（替代 allow/deny）─────────────────────────────────
# 1) htpasswd -c /etc/nginx/pool-dash.htpasswd <user>
# 2) 在上面的 location 内加两行并注释掉 allow/deny：
#        auth_basic           "OpencodeLitellmPool";
#        auth_basic_user_file /etc/nginx/pool-dash.htpasswd;
# 3) nginx -t && nginx -s reload
