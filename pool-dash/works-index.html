  .card:hover { box-shadow: 0 6px 18px rgba(0,0,0,.08); transform: translateY(-2px); }
  .card .name { font-size: 18px; font-weight: 600; }
  .card .desc { font-size: 14px; color: #6b7280; margin-top: 4px; }
</style>
