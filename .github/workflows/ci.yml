name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 必须排在任何会生成 .pyc 的步骤之前：扫描器按工作树扫描，产物会误报。
      - name: Secret scan
        run: node scripts/scan-secrets.mjs

      - name: Shell syntax check
        run: |
          set -e
          while IFS= read -r f; do
            bash -n "$f"
            echo "ok $f"
          done < <(git ls-files '*.sh')

      - name: Python compile
        run: python -m compileall -q pool pool-dash pool-egress dsh-config

      - name: Unit tests (pool-dash)
        run: PYTHONPATH=. python -m unittest discover -s pool-dash -p 'test_*.py'

      - name: Standalone test scripts
        run: |
          set -e
          PYTHONPATH=. python pool/tools/test_upstream_policy.py
          PYTHONPATH=. python pool/tools/test_sidecar_units.py
          PYTHONPATH=. python pool/tools/test_session_tree_key.py

      - name: Validate compose file
        run: |
          python -m pip install --quiet pyyaml
          python -c "import yaml; yaml.safe_load(open('deploy/docker-compose.yml')); print('compose yaml ok')"
